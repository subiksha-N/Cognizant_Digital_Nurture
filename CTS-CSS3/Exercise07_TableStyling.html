<!DOCTYPE html>
<html>
<head>

<style>

table{

width:100%;

border-collapse:collapse;

text-align:center;
}

th,td{

border:1px solid black;

padding:10px;
}

tr:nth-child(even){

background-color:#f2f2f2;
}

th{

background-color:lightblue;
}

</style>

</head>

<body>

<table>

<tr>
<th>ID</th>
<th>Name</th>
</tr>

<tr>
<td>1</td>
<td>Dharaneesh</td>
</tr>

<tr>
<td>2</td>
<td>Karthik</td>
</tr>

</table>

</body>
</html>
