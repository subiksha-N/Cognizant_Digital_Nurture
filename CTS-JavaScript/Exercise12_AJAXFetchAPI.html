<!DOCTYPE html>
<html>
<body>

<button onclick="registerUser()">
Register
</button>

<p id="result"></p>

<script>

function registerUser(){

document
.getElementById("result")
.innerHTML =
"Loading...";

setTimeout(() => {

fetch(
'https://jsonplaceholder.typicode.com/posts',
{
method:'POST',

headers:{
'Content-Type':
'application/json'
},

body:JSON.stringify({

name:'Dharaneesh',
event:'Tech Workshop'

})
}
)

.then(response =>
response.json())

.then(data => {

document
.getElementById("result")
.innerHTML =
"Registration Successful";

})

.catch(error => {

document
.getElementById("result")
.innerHTML =
"Registration Failed";

});

},2000);

}

</script>

</body>
</html>
