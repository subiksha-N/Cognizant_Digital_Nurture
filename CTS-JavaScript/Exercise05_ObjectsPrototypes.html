<!DOCTYPE html>
<html>
<body>

<script>

class Event {

constructor(name,seats){

this.name = name;
this.seats = seats;
}
}

Event.prototype.checkAvailability =
function(){

return this.seats > 0;
};

const event1 =
new Event("Tech Event",25);

console.log(
event1.checkAvailability()
);

console.log(
Object.entries(event1)
);

</script>

</body>
</html>
