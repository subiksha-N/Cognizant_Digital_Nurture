<!DOCTYPE html>
<html>
<head>

<script>

function ready() {

    document.getElementById("msg")
    .innerHTML =
    "Video Ready To Play";
}

window.onbeforeunload =
function() {

    return "Leave Page?";
}

</script>

</head>

<body>

<video
width="400"
controls
oncanplay="ready()">

<source
src="video.mp4"
type="video/mp4">

</video>

<p id="msg"></p>

</body>
</html>
